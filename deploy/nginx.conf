# 單一入口反向代理：把 erp-agent（外殼）與 claude-frontend（開發者 Agent，掛在 /dev）
# 放在同一個網域，讓 iframe 與 cf_session cookie 同站台運作。
#
# 放置位置：這是 http{} 內的片段（map + server），請放到 /etc/nginx/conf.d/erp.conf
# （conf.d 預設被 include 在 http 區塊內）。不要用 `nginx -t -c 本檔`（那會把它當成
# 最外層設定而報 map 不允許）；以 conf.d 放置後跑 `nginx -t` 即可。
#
# 後端服務（都只綁 127.0.0.1，不對外）：
#   erp Next.js  :3005   erp FastAPI :8000
#   cf Fastify   :8787   cf web 靜態檔（CF_BASE=/dev/ npx vite build → web/dist）
#
# 部署前先建好 cf 前端靜態檔（含 /dev 前綴）：
#   cd claude-frontend/web && CF_BASE=/dev/ npx vite build
# 並讓 cf 後端帶上 SSO 環境變數（claude-frontend/start.sh 預設已處理：
#   APP_JWT_SECRET 取自 erp-agent/.env、CF_ERP_SSO=1、CF_COOKIE_PATH=/dev）。

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;   # 換成你的網域，例如 app.company.com

    # --- claude-frontend：開發者 Agent（掛在 /dev）---
    # 比 /dev/ 更長的前綴（/dev/api、/dev/ws）會優先匹配，故 API/WS 不會被靜態檔吃掉。
    location /dev/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;   # 帶上 cf_session
    }
    location /dev/ws/ {
        proxy_pass http://127.0.0.1:8787/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Cookie $http_cookie;   # 升級請求也要帶 cookie（cf 在升級時驗 session）
        proxy_read_timeout 1d;                  # 長連線聊天 socket
    }
    location = /dev/status {
        proxy_pass http://127.0.0.1:8787/status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 1d;
    }
    # cf 前端靜態檔（vite build 以 base=/dev/ 產出，資產路徑都是 /dev/...）
    location /dev/ {
        alias /home/hermes/claude-frontend/web/dist/;
        try_files $uri $uri/ /dev/index.html;
    }

    # --- erp-agent（外殼，根路徑）---
    location /api/   { proxy_pass http://127.0.0.1:8000/api/; }
    location /files/ { proxy_pass http://127.0.0.1:8000/files/; }
    location / {
        proxy_pass http://127.0.0.1:3005/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Next.js dev HMR / 一般升級
        proxy_set_header Connection $connection_upgrade;
    }
}
