# erp-agent 的可容器化服務。
#
# 注意:預設 ppt 引擎 ppt-agent 是【獨立部署】的 sibling 服務(../agents/ppt-agent),
#       有自己的 docker-compose.yml,不在這裡 build —— erp-agent 只用 URL 連它(PPT_AGENT_URL)。
#       start.sh 會自動帶起它;手動則到 ../agents/ppt-agent 跑 docker compose up -d。
#
# 這裡只留 Presenton(回滾用,僅 USE_PRESENTON_PPT=true 時需要):
#   docker compose up -d presenton
#   docker compose down
# 秘鑰從同目錄的 .env 讀(compose 自動載入 .env 做 ${VAR} 代換),不進 repo。
services:
  # ── 舊版簡報引擎 Presenton（回滾用,僅 USE_PRESENTON_PPT=true 時才需要）。 ──
  # Port：容器內 80，對外預設 5001（macOS 的 5000 被 AirPlay 佔用）。
  presenton:
    image: ghcr.io/presenton/presenton:latest
    container_name: presenton
    restart: unless-stopped
    ports:
      - "${PRESENTON_PORT:-5001}:80"
    environment:
      LLM: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?需要在 .env 設 OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      IMAGE_PROVIDER: pexels
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      CAN_CHANGE_KEYS: "false"
    volumes:
      - presenton_data:/app_data

volumes:
  presenton_data:
