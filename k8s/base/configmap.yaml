# 非機密設定（單一事實來源；機密在 secret）。env 注入各容器。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  # erp-api 連叢集內的固定入口（Service 名，不是 localhost）
  DATABASE_URL: "postgresql://erp@postgres:5432/erp"
  # 對話記憶持久化到 Postgres（不在 RAM）→ erp-api 可安全開多 replica，
  # round-robin 到任何 pod 都接得到同一條對話（記憶是無狀態 HTTP 的前提）。
  CHECKPOINT_DATABASE_URL: "postgresql://erp@postgres:5432/erp"
  PPT_AGENT_TRANSPORT: "sse"
  PPT_AGENT_URL: "http://ppt-agent:8000/sse"   # ← Service 名固定入口；Pod 擴縮 erp-api 不用改
  USE_PRESENTON_PPT: "false"
  OPENAI_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0"
  OPENAI_MAX_RETRIES: "2"          # 撞 rate limit 自動重試（指數退避）
  # 模型分級（選填，§25 P1-7）：不設則全用 OPENAI_MODEL。要分級就取消註解：
  # OPENAI_MODEL_FAST: "gpt-4o-mini"     # supervisor 路由
  # OPENAI_MODEL_STRONG: "gpt-4o"        # analyst 決策分析
  # 觀測 LangSmith tracing（§25 P1-9）：要開就設 true 並在 agent-secrets 放 LANGSMITH_API_KEY。
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: "erp-agent"
  # 產物交付走物件儲存：ppt-agent 上傳、erp-api /files 串流，兩者不再共用磁碟（可跨節點）。
  # 連叢集內 MinIO 的固定入口；雲端可改指 AWS S3 端點。金鑰在 agent-secrets。
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_BUCKET: "erp-outputs"
