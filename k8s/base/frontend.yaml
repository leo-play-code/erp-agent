# 前端（Next.js）。同源代理：/api、/files 由前端 rewrites 轉到 erp-api Service。
# 對外只開這個（ingress → frontend），後端/檔案都走同源,沿用既有單一網址設計。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: erp-frontend:0.1.0
          imagePullPolicy: Never
          ports: [ { containerPort: 3000 } ]
          env:
            - { name: BACKEND_ORIGIN, value: "http://erp-api:8000" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports: [ { port: 3000, targetPort: 3000 } ]
