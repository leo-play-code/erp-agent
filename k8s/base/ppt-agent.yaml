# ppt-agent —— 外部化的可攜式簡報服務（image 由 ../agents/ppt-agent 建）。
# erp-api 經 Service 名 http://ppt-agent:8000/sse 連它（固定入口）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppt-agent
  labels: { app: ppt-agent }
spec:
  replicas: 1                      # min=1 常駐；尖峰由 HPA 擴到 max
  selector:
    matchLabels: { app: ppt-agent }
  template:
    metadata:
      labels: { app: ppt-agent }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ppt-agent
          image: ppt-agent:0.1.0
          imagePullPolicy: Never   # 本地 image 已匯進 k3s containerd，不對外拉
          ports: [ { containerPort: 8000 } ]
          env:
            - { name: MCP_TRANSPORT,        value: "sse" }
            - { name: MCP_HOST,             value: "0.0.0.0" }
            - { name: MCP_PORT,             value: "8000" }
            - { name: PUBLIC_FILES_PREFIX,  value: "/files" }
            - { name: PPT_MAX_CONCURRENCY,  value: "2" }
            # 產物上傳物件儲存（與 erp-api 共用同一 bucket，取代共享 PVC → 可跨節點）。
            # optional=true：未設 S3 金鑰時（disk-mode 回滾）Pod 仍能啟動，渲染回寫本地。
            - { name: S3_ENDPOINT_URL, valueFrom: { configMapKeyRef: { name: agent-config,  key: S3_ENDPOINT_URL, optional: true } } }
            - { name: S3_BUCKET,       valueFrom: { configMapKeyRef: { name: agent-config,  key: S3_BUCKET,       optional: true } } }
            - { name: S3_ACCESS_KEY,   valueFrom: { secretKeyRef:    { name: agent-secrets, key: S3_ACCESS_KEY,   optional: true } } }
            - { name: S3_SECRET_KEY,   valueFrom: { secretKeyRef:    { name: agent-secrets, key: S3_SECRET_KEY,   optional: true } } }
          resources:               # 對應 agent.yaml（§16）
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "750m", memory: "512Mi" }
          readinessProbe:          # /healthz（§25 P0-3）：HTTP 層能回 200 才算就緒，
            httpGet: { path: /healthz, port: 8000 }   # 比 tcpSocket 準，新 Pod 就緒前不收流量
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ppt-agent          # ← erp-api 連這個固定名稱；Pod 擴縮自動分流
spec:
  selector: { app: ppt-agent }
  ports: [ { port: 8000, targetPort: 8000 } ]
  # ★ MCP-SSE 是有狀態的：GET /sse 拿 session_id、POST /messages/?session_id=X 必須回到同一個
  # pod，否則 404。用 ClientIP 黏著把同一來源(erp-api)的 SSE+POST 釘在同一 replica。
  # 註：單一 erp-api 來源 IP 會固定打到某一個 ppt replica（正確但不跨 replica 分散）；
  # 要 SSE 跨 replica 真分流，需 §19 的 session 感知 LB（Traefik sticky by session）或改
  # streamable-http transport —— 屬後續優化。
  sessionAffinity: ClientIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ppt-agent
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ppt-agent }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
