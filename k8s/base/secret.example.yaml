# 範本：實際請勿入庫明文金鑰。部署時用指令建立真正的 Secret：
#   kubectl -n agents create secret generic agent-secrets \
#     --from-literal=OPENAI_API_KEY="$(grep -E '^OPENAI_API_KEY=' .env | cut -d= -f2-)" \
#     --from-literal=S3_ACCESS_KEY="minioadmin" \
#     --from-literal=S3_SECRET_KEY="$(openssl rand -hex 16)"
# 這個檔只是讓 kustomize 在沒手動建時也能 apply（用假值），上線前請覆蓋成真的。
# S3_ACCESS_KEY/S3_SECRET_KEY 同時是 MinIO 的 root 帳密（minio.yaml 讀同兩個 key）。
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "REPLACE_ME"
