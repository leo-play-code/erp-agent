apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev 覆蓋層：單機 k3s。沿用 base（local-path、min replica）。
# 之後 prod 覆蓋層在這裡改 replicas/resources/storageClassName/ingress annotations，base 不動。
resources:
  - ../../base

# 範例：dev 不開 HPA 自動擴縮也行，這裡先沿用 base。
# patches:
#   - path: patch-replicas.yaml
